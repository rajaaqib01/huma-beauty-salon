[build]
  command = "npm run build"
  # Skip rebuild when only data/*.json changed on main (legacy GitHub commits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data/'"

[context.branch-deploy]
  # Never build branch deploys for live-data / other branches.
  ignore = "exit 0"

# Netlify secrets scanner: public salon contact info is not a credential.
# Set real secrets only in Netlify UI → Site settings → Environment variables.
# Use ADMIN_EMAIL / ADMIN_PASSWORD (not VITE_ADMIN_* — this is Next.js, not Vite).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "components/Footer.js,pages/contact.js,data/settings.json,lib/settings.js,lib/emailTransport.js,pages/api/send-email.js,data/bookings.json,data/messages.json,data/admin_users.json"

[[plugins]]
  package = "@netlify/plugin-nextjs"
