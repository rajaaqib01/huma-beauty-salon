[build]
  command = "npm run build"

[context.branch-deploy]
  # Never build branch deploys for live-data / other branches.
  ignore = "exit 0"

# Netlify secrets scanner: public salon contact info is not a credential.
# Set real secrets only in Netlify UI → Site settings → Environment variables.
# Use ADMIN_EMAIL / ADMIN_PASSWORD (server-side). Remove any VITE_ADMIN_* vars from Netlify.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "components/Footer.js,components/SEO.js,pages/contact.js,data/settings.json,lib/settings.js,lib/emailTransport.js,pages/api/send-email.js,data/bookings.json,data/messages.json,data/admin_users.json"

[[plugins]]
  package = "@netlify/plugin-nextjs"
